name: Deploy to Hostinger FTP
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp
      - name: Check lftp version
        run: lftp --version
      - name: Test basic command
        run: echo "Testing" && sleep 5 && echo "Done"
