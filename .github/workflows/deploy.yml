name: Deploy to Hostinger FTP
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Deploy via FTP
        run: |
          lftp -c "
            set ftp:ssl-allow no
            set ftp:force-password yes
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_HOST }}
            mirror -R --verbose \
              --exclude-glob .git \
              --exclude-glob .github \
              --exclude-glob .gitignore \
              --exclude-glob README.md \
              --exclude-glob AGENTS.md \
              --exclude-glob .DS_Store \
              --exclude-glob '*.md' \
              ./ ./
          "
