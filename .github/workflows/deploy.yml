name: Deploy to Hostinger
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "set ftp:ssl-allow no; open -u $FTP_USER,$FTP_PASS $FTP_SERVER; mirror -R --delete --verbose --exclude-glob .git* --exclude-glob .github --exclude-glob .gitignore --exclude-glob README.md --exclude-glob AGENTS.md ./ /public_html/"
        env:
          FTP_SERVER: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
