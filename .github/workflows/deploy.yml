name: Deploy to Hostinger via FTP

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /home/u491050298/domains/apgracefuljourneyeducation.com/public_html/
          exclude: |
            .git*
            .github/**
            README.md
            AGENTS.md
            .DS_Store
            .DS_Store
