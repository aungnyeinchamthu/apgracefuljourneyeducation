name: Deploy to Hostinger FTP
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Uploading files..."
          curl -v -T index.php "ftp://${FTP_HOST}/index.php" -u "${FTP_USER}:${FTP_PASS}"
          curl -v -T download-university-list.php "ftp://${FTP_HOST}/download-university-list.php" -u "${FTP_USER}:${FTP_PASS}"
          curl -v -T University_List.xlsx "ftp://${FTP_HOST}/University_List.xlsx" -u "${FTP_USER}:${FTP_PASS}"
          for f in images/*/*; do [ -f "$f" ] && curl -v -T "$f" "ftp://${FTP_HOST}/$f" -u "${FTP_USER}:${FTP_PASS}"; done
          echo "Done!"
